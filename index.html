<script>
(()=>{'use strict';const viewer=document.getElementById('viewer'),message=document.getElementById('message'),bar=document.getElementById('bar'),status=document.getElementById('status');
const p=new URLSearchParams(location.hash.slice(1)),key=p.get('k');
function tell(h,d){document.getElementById('heading').textContent=h;document.getElementById('detail').textContent=d;}
function bytes(s){const normalized=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(normalized),c=>c.charCodeAt(0));}
async function share(){try{await navigator.clipboard.writeText(location.href);status.textContent='已复制完整分享链接。拿到这个链接的人可以查看，也可以继续转发。';}catch{status.textContent='请复制浏览器地址栏中的完整网址，包括 # 后面的内容。';}}
document.getElementById('copy').addEventListener('click',share);

if(!key){tell('需要完整的分享链接','这个页面需要链接中的解密钥匙。请向分享者索取完整网址，保留 # 及其后面的全部内容。');return;}
if(!crypto.subtle){tell('请通过安全网址打开','此页面需要支持加密功能的浏览器，并通过HTTPS或本地预览服务打开。');return;}
(async()=>{try{const packet=JSON.parse(document.getElementById('payload').textContent);if(bytes(key).length!==32)throw Error('key');const imported=await crypto.subtle.importKey('raw',bytes(key),{name:'AES-GCM'},false,['decrypt']);const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(packet.iv)},imported,bytes(packet.data));let html=new TextDecoder().decode(decoded);const initial=new URLSearchParams();for(const [name,allowed] of [['db',['dyadic','family']],['direction',['EG_to_EA','EA_to_EG']],['level',['W','B']]]){if(allowed.includes(p.get(name)))initial.set(name,p.get(name));}const seed='<script>window.__APIM_INITIAL_VIEW__='+JSON.stringify(initial.toString())+';<'+ '/script>';html=html.replace('<head>','<head>'+seed);viewer.srcdoc=html;viewer.hidden=false;bar.hidden=false;message.hidden=true;}catch{tell('链接无效或内容已更新','请检查是否复制了完整链接，或向分享者索取最新链接。');}})();
